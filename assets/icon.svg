<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Tactical Grid Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#334155" stroke-width="2.5" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="156" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="356" x2="256" y2="456" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <line x1="56" y1="256" x2="156" y2="256" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <line x1="356" y1="256" x2="456" y2="256" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  
  <!-- Frontline Shift Polygon / Tactical Emblem -->
  <polygon points="170,290 256,140 342,290 286,370 226,370" fill="url(#accentGrad)" opacity="0.9" />
  <polygon points="170,290 256,140 342,290 286,370 226,370" fill="none" stroke="#fca5a5" stroke-width="3" />
  
  <!-- Center OSINT Beacon -->
  <circle cx="256" cy="256" r="22" fill="#080c14" stroke="#38bdf8" stroke-width="5" />
  <circle cx="256" cy="256" r="10" fill="url(#cyanGrad)" />
</svg>
