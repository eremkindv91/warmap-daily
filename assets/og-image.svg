<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Tactical Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Top Bar & Live OSINT Badge -->
  <rect x="80" y="70" width="220" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="102" cy="89" r="6" fill="#22c55e"/>
  <text x="118" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="1">LIVE OSINT 24H</text>
  
  <!-- Brand Title -->
  <text x="80" y="200" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    WarMap <tspan fill="url(#redAccent)">Daily</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="260" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="500">
    Ежедневная верифицированная сводка и тактическая карта контроля
  </text>
  
  <!-- Feature Pills -->
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="310" height="54" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">🎯 Объективный контроль</text>
    
    <rect x="330" y="0" width="310" height="54" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="354" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">⚡ Выжимка за 60 секунд</text>
    
    <rect x="660" y="0" width="310" height="54" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="684" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">🗺️ Динамика ЛБС и спутники</text>
  </g>
  
  <!-- Metric Box -->
  <g transform="translate(80, 430)">
    <rect x="0" y="0" width="1040" height="120" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="40" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" text-transform="uppercase">Сдвиг контроля ЛБС</text>
    <text x="40" y="94" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="800">+4.85 км² / 24ч</text>
    
    <line x1="380" y1="25" x2="380" y2="95" stroke="#334155" stroke-width="1"/>
    
    <text x="420" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" text-transform="uppercase">Верификация</text>
    <text x="420" y="94" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="800">100% Фото/Видео/БПЛА</text>

    <line x1="760" y1="25" x2="760" y2="95" stroke="#334155" stroke-width="1"/>

    <text x="800" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" text-transform="uppercase">Вердикт</text>
    <text x="800" y="94" fill="#eab308" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="800">Статус-кво</text>
  </g>
</svg>
